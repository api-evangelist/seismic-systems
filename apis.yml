aid: seismic-systems
name: Seismic Systems
description: >-
  Seismic Systems Inc. is a fintech company building a privacy-enabled
  ("encrypted") blockchain — a shielded EVM implementing the "Mercury"
  specification — that aims to power a complete stablecoin stack. Backed by a
  $17M seed led by a16z crypto, Seismic lets developers build private tokens
  (SRC20) whose balances and transfers are hidden from observers, using shielded
  types in Solidity, TEE-encrypted calldata (ECDH + AES-GCM), and authenticated
  "signed reads." It ships first-party client SDKs for TypeScript (seismic-viem,
  seismic-react), Python (seismic-web3), and Rust (seismic-alloy), an sfoundry
  developer toolchain (sforge/sanvil/ssolc), a public testnet with a faucet and
  block explorer, published Claude Code agent skills, and a read-only SRC20
  Factory REST API for querying deployed tokens.
